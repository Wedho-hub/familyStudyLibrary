<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Golden Threads Family Library</title>
<script>
  // Apply any saved theme choice before first paint, to avoid a flash of the wrong theme.
  try{
    var savedTheme = localStorage.getItem('goldenThreadsTheme');
    if(savedTheme === 'light' || savedTheme === 'dark'){
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  }catch(e){}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: {
            DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
            raised: 'rgb(var(--c-surface-raised) / <alpha-value>)',
            card: 'rgb(var(--c-surface-card) / <alpha-value>)',
          },
          parchment: {
            DEFAULT: 'rgb(var(--c-text) / <alpha-value>)',
            dim: 'rgb(var(--c-text-dim) / <alpha-value>)',
            faint: 'rgb(var(--c-text-faint) / <alpha-value>)',
          },
          gold: { DEFAULT: 'rgb(var(--c-gold) / <alpha-value>)', bright: 'rgb(var(--c-gold-2) / <alpha-value>)' },
          sage: { DEFAULT: 'rgb(var(--c-sage) / <alpha-value>)', bright: 'rgb(var(--c-sage-2) / <alpha-value>)' },
          ember: { DEFAULT: 'rgb(var(--c-ember) / <alpha-value>)', bright: 'rgb(var(--c-ember-2) / <alpha-value>)' },
          clay: { DEFAULT: 'rgb(var(--c-clay) / <alpha-value>)', bright: 'rgb(var(--c-clay-2) / <alpha-value>)' },
          azure: { DEFAULT: 'rgb(var(--c-azure) / <alpha-value>)', bright: 'rgb(var(--c-azure-2) / <alpha-value>)' },
        },
        fontFamily: {
          display: ['Cinzel', 'Georgia', 'serif'],
          body: ['"EB Garamond"', 'Georgia', 'serif'],
          ui: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@500;600;700&display=swap">
<style>
  /* ===== Theme tokens — light is the default (best read length for scripture
     text on a mixed-age family screen); dark follows system preference or an
     explicit toggle. Values are R G B triplets consumed via rgb(var(..)/a).
     A fifth accent (azure) is purely decorative/structural — it never marks
     a person, so it can't be confused with the Wedho/Miranda/Elizabeth/
     Lunathi color-coding used throughout the Family Plan and Library. */
  :root{
    --c-surface: 247 241 227;
    --c-surface-raised: 240 231 209;
    --c-surface-card: 255 255 255;
    --c-text: 43 32 19;
    --c-text-dim: 90 72 50;
    --c-text-faint: 116 96 68;
    --c-gold: 150 100 16;
    --c-gold-2: 120 79 10;
    --c-sage: 47 92 66;
    --c-sage-2: 34 74 52;
    --c-ember: 158 61 40;
    --c-ember-2: 130 46 29;
    --c-clay: 154 88 24;
    --c-clay-2: 125 68 15;
    --c-azure: 40 82 130;
    --c-azure-2: 28 63 104;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --c-surface: 22 17 12;
      --c-surface-raised: 31 24 15;
      --c-surface-card: 37 28 18;
      --c-text: 233 220 192;
      --c-text-dim: 201 185 152;
      --c-text-faint: 168 148 114;
      --c-gold: 200 161 58;
      --c-gold-2: 230 195 100;
      --c-sage: 108 145 121;
      --c-sage-2: 139 174 151;
      --c-ember: 177 84 60;
      --c-ember-2: 208 114 90;
      --c-clay: 201 138 75;
      --c-clay-2: 224 167 104;
      --c-azure: 96 150 205;
      --c-azure-2: 140 185 227;
    }
  }
  :root[data-theme="dark"]{
    --c-surface: 22 17 12;
    --c-surface-raised: 31 24 15;
    --c-surface-card: 37 28 18;
    --c-text: 233 220 192;
    --c-text-dim: 201 185 152;
    --c-text-faint: 168 148 114;
    --c-gold: 200 161 58;
    --c-gold-2: 230 195 100;
    --c-sage: 108 145 121;
    --c-sage-2: 139 174 151;
    --c-ember: 177 84 60;
    --c-ember-2: 208 114 90;
    --c-clay: 201 138 75;
    --c-clay-2: 224 167 104;
    --c-azure: 96 150 205;
    --c-azure-2: 140 185 227;
  }

  html{ font-size:20px; }
  body{ background:rgb(var(--c-surface)); }
  ::selection{ background:rgb(var(--c-gold)); color:rgb(var(--c-surface)); }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:rgb(var(--c-text-faint) / 0.5); border-radius:3px; }
  details > summary{ list-style:none; cursor:pointer; }
  details > summary::-webkit-details-marker{ display:none; }
  .tab-btn[aria-selected="true"]{ color:rgb(var(--c-gold-2)); border-color:rgb(var(--c-gold)); }
  .person-pill[data-person="wedho"]{ background:rgb(var(--c-gold) / 0.16); color:rgb(var(--c-gold-2)); border-color:rgb(var(--c-gold) / 0.5); }
  .person-pill[data-person="miranda"]{ background:rgb(var(--c-sage) / 0.16); color:rgb(var(--c-sage-2)); border-color:rgb(var(--c-sage) / 0.5); }
  .person-pill[data-person="elizabeth"]{ background:rgb(var(--c-ember) / 0.16); color:rgb(var(--c-ember-2)); border-color:rgb(var(--c-ember) / 0.5); }
  .person-pill[data-person="lunathi"]{ background:rgb(var(--c-clay) / 0.16); color:rgb(var(--c-clay-2)); border-color:rgb(var(--c-clay) / 0.5); }
  .person-pill[data-person="none"]{ background:rgb(var(--c-text-faint) / 0.16); color:rgb(var(--c-text-faint)); border-color:rgb(var(--c-text-faint) / 0.4); }

  .icon-wed{ color:rgb(var(--c-gold-2)); } .icon-mir{ color:rgb(var(--c-sage-2)); }
  .icon-eli{ color:rgb(var(--c-ember-2)); } .icon-lun{ color:rgb(var(--c-clay-2)); }
  .icon-none{ color:rgb(var(--c-text-faint)); }
  .wash-wed{ background:rgb(var(--c-gold) / 0.07); border-color:rgb(var(--c-gold) / 0.3); }
  .wash-mir{ background:rgb(var(--c-sage) / 0.07); border-color:rgb(var(--c-sage) / 0.3); }
  .wash-eli{ background:rgb(var(--c-ember) / 0.07); border-color:rgb(var(--c-ember) / 0.3); }
  .wash-lun{ background:rgb(var(--c-clay) / 0.07); border-color:rgb(var(--c-clay) / 0.3); }
  .icon-azure{ color:rgb(var(--c-azure-2)); }
  .wash-azure{ background:rgb(var(--c-azure) / 0.07); border-color:rgb(var(--c-azure) / 0.3); }

  .hero-band{
    background: linear-gradient(120deg,
      rgb(var(--c-gold) / 0.16), rgb(var(--c-ember) / 0.12) 45%, rgb(var(--c-azure) / 0.12) 100%);
  }

  .card-hover{ transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .card-hover:hover{ transform: translateY(-3px); box-shadow: 0 10px 24px -10px rgb(var(--c-text) / 0.28); }

  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }
  .view-enter{ animation: fadeSlideIn .4s ease both; }

  @keyframes popCelebrate{ 0%{ transform:scale(1);} 45%{ transform:scale(1.22); } 100%{ transform:scale(1);} }
  .animate-pop{ animation: popCelebrate .45s cubic-bezier(.34,1.56,.64,1); }

  @keyframes flashHighlight{
    0%{ box-shadow: 0 0 0 0 rgb(var(--c-gold) / 0.55); }
    100%{ box-shadow: 0 0 0 14px rgb(var(--c-gold) / 0); }
  }
  .animate-flash{ animation: flashHighlight 1s ease-out 2; }

  .bar-fill{ transition: width .7s cubic-bezier(.22,1,.36,1); }

  .icon-btn svg{ width:1.15em; height:1.15em; }
  .step-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.6rem; height:1.6rem; border-radius:9999px; font-family:'Cinzel',serif;
    font-size:0.8rem; flex:0 0 auto;
  }

  @media (prefers-reduced-motion: reduce){
    .view-enter, .animate-pop, .animate-flash{ animation:none !important; }
    .card-hover{ transition:none !important; }
  }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff !important; }
    :root{ --c-surface:255 255 255; --c-text:0 0 0; --c-surface-card:255 255 255; }
    details{ break-inside: avoid; }
    .card-hover:hover{ transform:none; box-shadow:none; }
  }
</style>
</head>

<script>

/** @typedef {'wedho'|'miranda'|'elizabeth'|'lunathi'} PersonId */

/** @type {{id:PersonId, name:string, role:string, tagline:string, icon:string}[]} */

 */

/** @type {Topic[]} */
const TOPICS = [
  // ---------------- WEDHO — most complex / systematic ----------------

    recommendedReading:{ title:'Patriarchs and Prophets', author:'Ellen G. White', note:'Its chapters on building the sanctuary show why a physical building mattered so much to God, long before Jesus ever called Himself a temple.' },
    outreach:'Notice people who feel like they don’t “fit the build” — new arrivals, visitors, anyone left out of the group photo. Making room for them is a small, real echo of the rejected stone becoming the cornerstone, and it’s often the simplest door into a real conversation about faith.'

    forChild:'Water a small plant together every day for a week. Say: “A branch can’t grow fruit by trying hard — it just has to stay attached to the vine. That’s how we stay close to Jesus.” Let her notice any new growth as the week goes on.',
    recommendedReading:{ title:'Christ’s Object Lessons', author:'Ellen G. White', note:'Its chapter on the vine and the vineyard ties John 15 back to Israel’s own prophetic self-description in Isaiah 5 and Psalm 80.' },
    outreach:'Let your life visibly “abide” — steady, unhurried, unstressed — rather than striving to look impressive. People are drawn to calm, fruitful lives long before they ever ask what’s feeding them.'
  },
  {
    id:'harvest', icon:'sickle', title:'Harvest, Sowing & Seed', category:'Kingdom & Judgment', complexity:3, defaultAssignee:'miranda',
    thread:'Patient with the growing season; certain about the final accounting.',
    ot:['“Seedtime and harvest” — Genesis 8:22','“Sow in tears, reap in joy” — Psalm 126:5-6','“Put in the sickle, the harvest is ripe” — Joel 3:13'],
    jesus:['Parable of the sower — Matthew 13:3-9,18-23','Wheat and tares, harvest is the end of the age — Matthew 13:24-30,36-43','“The harvest is plentiful, the laborers few” — Matthew 9:37-38','Mustard seed — Matthew 13:31-32'],
    apostolic:['“Paul planted, Apollos watered, God gave the growth” — 1 Corinthians 3:6-9','“Whatever one sows, that will he reap” — Galatians 6:7-9','The harvest of the earth, one like a son of man with a sickle — Revelation 14:14-16'],
    character:'He lets growth happen where it can’t be watched, but he never loses count of what was sown.',
    glossary:['threshing-practice'],
    forChild:'Grow something small together, start to finish — cress on a windowsill works well. Say: “God is patient while things grow, but He never forgets what was planted.” Celebrate together on the day it’s ready.',
    recommendedReading:{ title:'Christ’s Object Lessons', author:'Ellen G. White', note:'Its chapters on the sower and the wheat and tares are the fullest treatment of patient growth and a certain final harvest.' },
    outreach:'Plant seeds in conversations without expecting an instant harvest — one honest word, one invitation, one shared verse, left to grow in someone’s own time. Following up gently months later, not just once, is often what people actually remember.'
  },
  {
    id:'fire', icon:'flame', title:'Fire & Refining', category:'Covenant & Identity', complexity:3, defaultAssignee:'miranda',
    thread:'A bush that burns without being consumed, a Refiner who purifies rather than merely punishes.',
    ot:['Burning bush, not consumed — Exodus 3:2','Pillar of fire by night — Exodus 13:21','“He is like a refiner’s fire” — Malachi 3:2-3'],
    jesus:['“I came to cast fire on the earth” — Luke 12:49','“He will baptize you with the Holy Spirit and fire” — spoken of him — Matthew 3:11'],
    apostolic:['Tongues of fire at Pentecost — Acts 2:3','Each one’s work tested by fire — 1 Corinthians 3:13-15','Faith tested by fire, more precious than gold — 1 Peter 1:7','Eyes like a flame of fire — Revelation 1:14','“Buy from me gold refined by fire” — to Laodicea — Revelation 3:18'],
    character:'His holiness burns to purify, not merely to consume — the same fire that judges Laodicea’s lukewarmness is offered to her as gold.',
    wordBridge:'Hebrew <b>ruach</b> (רוַּח) means spirit, breath, and wind all at once — fire and ruach travel together through the Old and New Testaments as signs of God’s active presence.',
    glossary:['ruach','qadosh'],
    forChild:'Light a candle safely together, with you holding it, then blow it out together. Say: “Fire doesn’t just burn things up — it can also make things pure, like melting gold to get the dirt out.” Talk about God’s presence being like that flame.',
    recommendedReading:{ title:'Prophets and Kings', author:'Ellen G. White', note:'Its account of Elijah and the prophets shows fire and refining as recurring, deliberate signs of God dealing with His people — the same imagery behind Malachi’s refiner.' },
    outreach:'Let hard seasons refine rather than harden you, visibly enough that others notice the difference. A person who comes out of difficulty gentler and more grounded, not bitter, becomes someone others want to ask, “how did you get through that?”'
  },

  // ---------------- ELIZABETH — accessible, comfort-rich, narrative ----------------
  {
    id:'shepherd', icon:'crook', title:'Shepherd & Sheep', category:"God's Household", complexity:2, defaultAssignee:'elizabeth',
    thread:'Not a hired hand who runs, but the one who goes looking for the single lost sheep himself.',
    ot:['“The Lord is my shepherd” — Psalm 23','“He will gather the lambs in his arms” — Isaiah 40:11','False shepherds condemned; “I myself will search for my sheep” — Ezekiel 34'],
    jesus:['“I am the good shepherd,” lays down his life — John 10:1-18','Parable of the lost sheep — Luke 15:3-7','Sheep and goats separated at judgment — Matthew 25:31-33','“Feed my sheep” — to Peter — John 21:15-17'],
    apostolic:['“The Shepherd and Overseer of your souls” — 1 Peter 2:25','Elders shepherd the flock, await the Chief Shepherd — 1 Peter 5:2-4','“The great shepherd of the sheep” — Hebrews 13:20','“The Lamb will be their shepherd” — Revelation 7:17'],
    character:'Leadership as pursuit, not control. He doesn’t wait for the lost sheep to find its own way back.',
    wordBridge:'Greek <b>poimen</b> (ποιμήν), “shepherd,” is the same word behind “pastor” — the job was never meant to be management, it was meant to be presence.',
    glossary:['poimen','shepherding-practice'],
    forChild:'Play a quick hide-and-seek with a stuffed animal and go find it together. Say: “Jesus is like a shepherd who goes looking for the one who’s lost, even if He already has ninety-nine others.” Celebrate finding it the way Jesus celebrates.',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its chapter on the good shepherd draws out exactly why a shepherd who owns the sheep behaves so differently from a hired hand who doesn’t.' },
    outreach:'Actually go find the person who’s stopped showing up, rather than waiting for them to come back on their own. A single “I noticed you were missing, and I care” text does more relational work than most planned outreach events.'
  },
  {
    id:'bread', icon:'loaf', title:'Bread & Manna', category:"God's Household", complexity:2, defaultAssignee:'elizabeth',
    thread:'Daily, personal, impossible to stockpile — provision as relationship, not supply.',
    ot:['Manna, gathered daily — Exodus 16','Bread of the Presence in the tabernacle — Exodus 25:30','Widow’s flour and oil that never ran out — 1 Kings 17:6,13-16'],
    jesus:['“I am the bread of life” — John 6:32-35,48-51','Feeding the 5,000 and the 4,000 — Matthew 14:13-21; 15:32-38','“Give us this day our daily bread” — Matthew 6:11','“This is my body” — Matthew 26:26'],
    apostolic:['One loaf, one body — 1 Corinthians 10:16-17','Institution of the Lord’s Supper — 1 Corinthians 11:23-26','Breaking of bread in the early church — Acts 2:42,46','“The hidden manna” promised to the overcomer — Revelation 2:17'],
    character:'He sustains a day at a time and refuses to be hoarded — manna kept overnight bred worms. Provision that has to be received fresh keeps you coming back to him.',
    wordBridge:'The word <b>manna</b> comes from the Hebrews’ own question, “man hu?” — “what is it?” They named the miracle after their own confusion, and ate it anyway.',
    glossary:['manna'],
    forChild:'Bake or share a simple loaf of bread together and break it by hand instead of cutting it. Say: “Jesus called Himself the Bread of Life — we need Him every single day, the same way we need food every day.” Say a short thank-you prayer before eating it.',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its accounts of the feeding miracles and Christ’s “bread of life” teaching in John 6 unpack why He chose that image for Himself.' },
    outreach:'Feed people — literally. Invite someone to a meal, bring food to someone struggling, sit with someone eating alone. Shared food is one of the oldest, most disarming ways to build a real friendship, and it’s exactly the picture Jesus kept reaching for.'
  },
  {
    id:'water', icon:'droplet', title:'Water & Living Water', category:'Covenant & Identity', complexity:2, defaultAssignee:'elizabeth',
    thread:'From a struck rock to a well at noon to a river with no temple left to flow from.',
    ot:['Water struck from the rock at Horeb — Exodus 17:6','“Come, everyone who thirsts” — Isaiah 55:1','Forsaken the fountain, hewed broken cisterns — Jeremiah 2:13','River flowing from the temple, healing everything it touches — Ezekiel 47:1-12'],
    jesus:['Woman at the well — living water welling up to eternal life — John 4:10-14','“Let him come to me and drink,” rivers of living water — John 7:37-39','His own baptism in the Jordan — Matthew 3:13-17','Washes the disciples’ feet — John 13:5'],
    apostolic:['“The Rock that followed them was Christ” — 1 Corinthians 10:4','Washing of water by the word — Ephesians 5:26','Spring of the water of life, without payment — Revelation 21:6','River of the water of life; “let the thirsty come” — Revelation 22:1,17'],
    character:'Grace is free, abundant, and offered person to person — not a resource you’re pointed toward, but someone who meets you at your own well at noon.',
    glossary:['chesed'],
    forChild:'Let her drink a full glass of water after playing outside on a hot day and ask how thirsty she was. Say: “Jesus told a thirsty woman at a well that He could give water that means her heart would never be thirsty again.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its account of the woman at the well shows the whole conversation in context, including why Jesus deliberately went out of His way to meet her there.' },
    outreach:'Meet people where their real thirst is — loneliness, exhaustion, shame — rather than where it’s convenient for you. Jesus deliberately routed through Samaria for one conversation; a friendship that goes out of its way for someone is remembered.'
  },
  {
    id:'light', icon:'sun', title:'Light & Darkness', category:'The Way of Wisdom', complexity:2, defaultAssignee:'elizabeth',
    thread:'Not just illumination — the source everything else only reflects.',
    ot:['“Let there be light” — Genesis 1:3-4','“The people who walked in darkness have seen a great light” — Isaiah 9:2','“Arise, shine, for your light has come” — Isaiah 60:1-3'],
    jesus:['“I am the light of the world” — John 8:12; 9:5','“You are the light of the world” — Matthew 5:14-16','The eye as the lamp of the body — Matthew 6:22-23'],
    apostolic:['“The light shines in the darkness” — John 1:4-5,9','“God is light, in him is no darkness at all” — 1 John 1:5-7','“Once darkness, but now light in the Lord” — Ephesians 5:8','No need of sun or lamp — the Lamb is its lamp — Revelation 21:23-24; 22:5'],
    character:'He isn’t lit from outside; every other light in scripture is borrowed brightness pointing back to him.',
    wordBridge:'Greek <b>logos</b> (λόγος), “word,” is what John calls Jesus in the very verse that introduces light shining in darkness — the light has always been a Person speaking.',
    glossary:['logos'],
    forChild:'Turn off the lights and light one small candle or torch together. Say: “Just one light can push back a lot of dark — Jesus called Himself the Light of the World, and He wants us to shine too.” Let her be the one holding the light.',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its opening chapters on “God With Us” describe why the incarnation itself is described as light entering darkness.' },
    outreach:'Be consistently, quietly different in the small stuff — honest, patient, kind when it costs you something — rather than announcing your faith loudly. A steady light is noticed by people long before a loud one is trusted.'
  },
  {
    id:'eyes', icon:'eye', title:'Eyes, Blindness & Sight', category:'Sight & Identity Restored', complexity:2, defaultAssignee:'elizabeth',
    thread:'He values honest blindness admitted over false sight claimed.',
    ot:['Seeing but not perceiving — Isaiah 6:9-10','“Open the eyes that are blind” — Isaiah 42:6-7','Servant’s eyes opened to the horses of fire — 2 Kings 6:17'],
    jesus:['Repeated healings of the blind — John 9; Mark 8:22-25','Quotes Isaiah 6 to explain why he teaches in parables — Matthew 13:13-15','Pharisees called “blind guides” — Matthew 23:16-26','“That those who do not see may see” — John 9:39-41'],
    apostolic:['Paul struck blind on the Damascus road, scales fall from his eyes — Acts 9:3-9,17-18','“The eyes of your heart enlightened” — Ephesians 1:18','Laodicea: “you do not know you are blind… buy salve” — Revelation 3:17-18'],
    character:'He’s willing to be the one who opens eyes at real cost to the one being opened — Paul’s healing came after three days of nothing.',
    glossary:['qadosh'],
    forChild:'Play a short blindfolded game, guiding her gently by the hand for a minute, then take it off. Say: “Jesus loves giving people their sight back — sometimes eyes that don’t work, and sometimes hearts that can’t see who He is yet.” Ask what she noticed most once she could see again.',
    recommendedReading:{ title:'Acts of the Apostles', author:'Ellen G. White', note:'Its account of Paul’s blindness on the Damascus road and the scales falling from his eyes is one of the clearest “sight restored” stories outside the Gospels.' },
    outreach:'Ask better questions and really listen, instead of assuming you already see someone’s situation clearly. People open up to those who admit “help me understand” rather than those who arrive with all the answers.'
  },

  // ---------------- LUNATHI — concrete, tangible, identity/decision themes ----------------
  {
    id:'leaven', icon:'bubbles', title:'Leaven', category:'Kingdom & Judgment', complexity:1, defaultAssignee:'lunathi',
    thread:'A little works through the whole lump — true of the kingdom, and just as true of hypocrisy.',
    ot:['Unleavened bread at Passover, leaven removed from the house — Exodus 12:15,19','No leaven in offerings burned to the Lord — Leviticus 2:11'],
    jesus:['Parable of the leaven — hidden, pervasive kingdom growth — Matthew 13:33','“Beware the leaven of the Pharisees” — their hypocrisy — Matthew 16:6,11-12; Luke 12:1'],
    apostolic:['“A little leaven leavens the whole lump” — purge the old leaven — 1 Corinthians 5:6-8','Same proverb, applied to false teaching — Galatians 5:9'],
    character:'He takes small things seriously in both directions — a small compromise spreads exactly like a small grace does.',
    wordBridge:'Greek <b>zyme</b> (ζύμη), “leaven,” was a piece of yesterday’s dough kept back to start tomorrow’s batch — see Leavening Process in the glossary. Try it yourself: bake one loaf with a starter and one without, side by side.',
    glossary:['zyme','leavening-practice'],
    forChild:'Bake two small batches of bread, one with yeast and one without, and compare them the next day. Say: “A tiny bit of yeast changes the whole loaf — that’s what Jesus said about both good things and bad things spreading quietly.” Let her poke the risen dough.',
    recommendedReading:{ title:'Christ’s Object Lessons', author:'Ellen G. White', note:'Its chapter on the leaven parable explains why Jesus picked something so small and ordinary to describe the kingdom’s hidden spread.' },
    outreach:'Remember that small, repeated kindness spreads exactly like leaven — one consistent, quiet good habit in a friend group changes its whole “flavor” over time, often more than one big gesture would.'
  },
  {
    id:'salt', icon:'shaker', title:'Salt', category:'The Way of Wisdom', complexity:1, defaultAssignee:'lunathi',
    thread:'A covenant seasoning meant to preserve and flavor, not merely to survive alongside the world.',
    ot:['“Season all your offerings with salt… the salt of the covenant” — Leviticus 2:13','“A covenant of salt forever” — Numbers 18:19'],
    jesus:['“You are the salt of the earth” — Matthew 5:13','“Have salt in yourselves, be at peace” — Mark 9:50'],
    apostolic:['“Let your speech be seasoned with salt” — Colossians 4:6'],
    character:'Identity that loses its distinctiveness loses its purpose — he calls his people to change the flavor of a room, not just occupy it.',
    wordBridge:'In the ancient world salt was valuable enough to help pay soldiers and seal binding agreements — see Salt as Covenant Seal in the glossary.',
    glossary:['salt-practice'],
    forChild:'Let her taste plain food, then the same food with a pinch of salt. Say: “Salt doesn’t have to be loud to change everything — Jesus said that’s what His people should be like in the world.” Let her be the one who adds the pinch.',
    recommendedReading:{ title:'Thoughts from the Mount of Blessing', author:'Ellen G. White', note:'Its comments on the Sermon on the Mount unpack “you are the salt of the earth” in its original setting.' },
    outreach:'Bring flavor to a room without dominating it — genuine warmth, humor, honesty — rather than either blending in completely or being preachy. People remember who made a gathering better just by being there.'
  },
  {
    id:'rock', icon:'boulder', title:'Rock & Foundation', category:'The Way of Wisdom', complexity:1, defaultAssignee:'lunathi',
    thread:'Tested, unshakeable, and freely offered as the only safe place to build a life.',
    ot:['“He is the Rock, his work is perfect” — Deuteronomy 32:4','“The Lord my rock and my fortress” — Psalm 18:2; 62:2,6-7','A tested stone, a sure foundation — Isaiah 28:16'],
    jesus:['Wise man builds his house on the rock — Matthew 7:24-27','“On this rock I will build my church” — Matthew 16:18'],
    apostolic:['“The Rock was Christ” — 1 Corinthians 10:4','“No foundation other than the one laid” — 1 Corinthians 3:11','A stone of stumbling, a rock of offense — 1 Peter 2:6-8, quoting Isaiah 28'],
    character:'Steadiness is a character trait before it’s a construction metaphor — what he asks you to build on, he already is.',
    glossary:[],
    forChild:'Build two small structures together — one on sand or loose dirt, one on a hard flat tile — and gently test both. Say: “Jesus said a wise person builds their whole life on Him, like building on rock instead of sand.” Let her predict which one will hold.',
    recommendedReading:{ title:'Thoughts from the Mount of Blessing', author:'Ellen G. White', note:'Its closing comments on the wise and foolish builders explain exactly what “building on the rock” meant to Jesus’s first hearers.' },
    outreach:'Be the steady, dependable friend — the one people can call at 2am, the one who doesn’t disappear when things get hard. Reliability, over years, is one of the strongest, quietest witnesses there is.'
  },
  {
    id:'way', icon:'signpost', title:'The Way & The Path', category:'The Way of Wisdom', complexity:1, defaultAssignee:'lunathi',
    thread:'Not directions to somewhere — a person, walked and walkable.',
    ot:['“The Lord knows the way of the righteous” — Psalm 1:6','The Way of Holiness — Isaiah 35:8','“This is the way, walk in it” — Isaiah 30:21'],
    jesus:['“I am the way, the truth, and the life” — John 14:6','Narrow gate vs. the broad way — Matthew 7:13-14','Emmaus road — “did not our hearts burn within us” — Luke 24:32'],
    apostolic:['The early church literally called “the Way” — Acts 9:2; 19:9,23; 24:14','“A new and living way,” opened through his flesh — Hebrews 10:19-20'],
    character:'He doesn’t just give directions — he is the road, which is why following him is relationship, not compliance.',
    wordBridge:'Hebrew <b>derek</b> (דֶּ֫רֶך) means road, but also “way of life” — the same word for the physical path and the whole direction of a person’s choices.',
    glossary:['derek'],
    forChild:'Walk a short, familiar path together and let her lead part of it from memory. Say: “Jesus said ‘I am the Way’ — following Him isn’t just knowing directions, it’s walking with a Person the whole way.” Hold her hand for the parts she doesn’t know yet.',
    recommendedReading:{ title:'Steps to Christ', author:'Ellen G. White', note:'Written specifically to walk a new believer through the very first steps of following Christ, making it the natural companion to this theme.' },
    outreach:'Literally walk alongside someone through a season rather than just pointing them toward help. Offering to go with a friend to something hard — a hospital visit, a difficult conversation, a first church visit — says more than directions ever could.'
  },
  {
    id:'clothing', icon:'shirt', title:'Clothing & Garments', category:'Covenant & Identity', complexity:1, defaultAssignee:'lunathi',
    thread:'Fig leaves fail; God clothes at the cost of a life; the robe is always given, never sewn by the wearer.',
    ot:['Fig-leaf coverings fail — Genesis 3:7','God clothes them in skins — the first death, on their behalf — Genesis 3:21','Priestly garments “for glory and for beauty” — Exodus 28','Garments of salvation, robe of righteousness — Isaiah 61:10'],
    jesus:['Man without a wedding garment cast out — Matthew 22:11-13','Woman healed touching the hem of his garment — Matthew 9:20-22','Transfiguration — garments become white as light — Matthew 17:2','Prodigal’s father: “bring the best robe” — Luke 15:22','His own garments gambled for at the cross — Matthew 27:35'],
    apostolic:['“Put on Christ” at baptism — Galatians 3:27','White robes washed in the blood of the Lamb — Revelation 7:9,14','“Buy white garments” so shame won’t be seen — Revelation 3:18','“Blessed is he who stays awake and keeps his garments” — Revelation 16:15'],
    character:'He covers our shame himself, at his own cost — righteousness is always something we’re clothed in, never something we manage to weave.',
    wordBridge:'Hebrew <b>kaphar</b> (כָפַר), “cover / atone,” is the same root behind the garment God provides in Genesis 3 — not decoration, atonement made wearable.',
    glossary:['kaphar','crucifixion-practice'],
    forChild:'Let her pick a favorite outfit and talk about how good clothes make you feel. Say: “After Adam and Eve made a mistake, they tried to cover themselves with leaves, but God made them real clothes Himself, at a cost — that’s what Jesus does for us too.”',
    recommendedReading:{ title:'Patriarchs and Prophets', author:'Ellen G. White', note:'Its account of the fall describes in detail why the fig leaves failed and what it meant for God Himself to provide the first covering.' },
    outreach:'Cover for people rather than exposing them — protect a friend’s dignity when they’ve messed up, instead of gossiping about it. Grace that covers someone at your own social cost is a vivid, personal picture of what this whole theme is about.'
  },

  // ---------------- EXTENSION THREADS — unassigned, library-only ----------------
  { id:'oil', icon:'lamp', title:'Oil & Anointing', category:'Extension Thread', complexity:2, defaultAssignee:null, extension:true,
    thread:'Samuel anoints David, "Christ" itself means Anointed One, the ten virgins’ oil, and being anointed to preach good news.',
    blurb:'Samuel anoints David with oil (1 Samuel 16) → the title "Christ" (Greek <i>Christos</i>) itself means Anointed One → the ten virgins carry oil for their lamps (Matthew 25) → Jesus reads Isaiah 61 and says he was anointed to preach good news to the poor (Luke 4:18).',
    forChild:'Rub a drop of scented oil or lotion on her hands and let her smell it. Say: “A long time ago, oil poured on someone’s head meant ‘you’re chosen for something special’ — Jesus’s own title, Christ, means the Anointed One.”',
    recommendedReading:{ title:'Prophets and Kings', author:'Ellen G. White', note:'Its account of Samuel’s anointing of David shows the ceremony and meaning behind pouring oil on someone God had chosen.' },
    outreach:'Notice and name the gifts you see in people — tell a friend specifically what you see God has equipped them for. Being “anointed” often starts, relationally, with someone else noticing first.' },
  { id:'gate', icon:'door', title:'Gate & Door', category:'Extension Thread', complexity:2, defaultAssignee:null, extension:true,
    thread:'Blood on the doorposts, "I am the door," the narrow gate, and twelve gates in a city with no need of walls to hide behind.',
    blurb:'Blood on the doorposts at Passover (Exodus 12) → "I am the door of the sheep" (John 10:7-9) → the narrow gate (Matthew 7:13) → Christ knocking at Laodicea’s door (Revelation 3:20) → the twelve gates of the New Jerusalem (Revelation 21:12-21).',
    forChild:'Stand together at a doorway and only let her through when you say it’s safe. Say: “Jesus said ‘I am the door’ — the only safe way into the sheep pen was through the shepherd himself, standing right in the gap.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its chapter on the good shepherd explains the actual sheepfold custom behind Jesus calling Himself both shepherd and door.' },
    outreach:'Be a safe “gate” for people — someone they can be fully honest with without fear of it being used against them. Trustworthy confidentiality is often what earns you the right to speak into someone’s life later.' },
  { id:'priesthood', icon:'building', title:'Priesthood & Mediator', category:'Extension Thread', complexity:3, defaultAssignee:null, extension:true,
    thread:'Aaron’s priesthood, a mysterious king-priest named Melchizedek, and a whole people made priests.',
    blurb:'Aaron’s priesthood established (Exodus 28-29) → Melchizedek, king and priest with no recorded genealogy (Genesis 14; Psalm 110) → Christ as our great high priest (Hebrews 4-7) → believers made "a kingdom of priests" (1 Peter 2:9; Revelation 1:6).',
    forChild:'Let her “help” you pray for someone else by name before bed. Say: “A priest is someone who carries other people’s needs to God — Jesus does that for us, and now He lets us do it for each other too.”',
    recommendedReading:{ title:'Patriarchs and Prophets', author:'Ellen G. White', note:'Its chapters on Aaron and the tabernacle service describe what mediating between God and the people actually involved, before Jesus took on that role permanently.' },
    outreach:'Pray for specific people by name and, when it feels right, tell them you did. Being told “I prayed for you this week” is one of the most quietly powerful things a friend can hear.' },
  { id:'veil', icon:'curtain', title:'Veil & Curtain', category:'Extension Thread', complexity:3, defaultAssignee:null, extension:true,
    thread:'A curtain no one could pass without dying, torn top to bottom the moment it no longer needed to stand.',
    blurb:'The veil shutting off the Most Holy Place (Exodus 26:33) → torn top to bottom at the crucifixion (Matthew 27:51) → "a new and living way through the curtain, that is, his flesh" (Hebrews 10:20).',
    forChild:'Hang a light sheet or towel across a doorway, then take it down together. Say: “There used to be a big curtain that kept people from getting close to God’s room — when Jesus died, it tore, top to bottom, because we don’t need to stay far away anymore.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its account of the crucifixion describes the temple veil tearing at the moment of Christ’s death and what it meant.' },
    outreach:'Remove your own “curtains” — be willing to be genuinely known, not just presentable. Vulnerability about your own struggles is often what gives someone else permission to be honest about theirs.' },
  { id:'feasts', icon:'calendar', title:'Feasts & Appointed Times', category:'Extension Thread', complexity:3, defaultAssignee:null, extension:true,
    thread:'Seven feasts on a calendar that turn out to be a prophecy written in holidays.',
    blurb:'The seven feasts of Leviticus 23 → Passover fulfilled at the cross (1 Corinthians 5:7) → Pentecost fulfilled in Acts 2 → the marriage supper of the Lamb still to come (Revelation 19:9).',
    forChild:'Pick one simple family tradition — a meal, a song, a Sabbath ritual — and do it together, asking her what it’s “for.” Say: “God gave His people special days to remember on purpose — each one was a promise about something Jesus would do.”',
    recommendedReading:{ title:'Patriarchs and Prophets', author:'Ellen G. White', note:'Its account of the sanctuary system includes the appointed feasts and why each one mattered on the calendar, not just in theory.' },
    outreach:'Invite people into your family’s rhythms and traditions rather than keeping them separate from your “regular” life. A shared meal on a meaningful day often opens a door no direct conversation could.' },
  { id:'mountain', icon:'mountain', title:'Mountain', category:'Extension Thread', complexity:2, defaultAssignee:null, extension:true,
    thread:'Fire and smoke at Sinai, a new law given from a hillside, and a mountain no one needs to fear approaching anymore.',
    blurb:'Sinai, where the law is given in fire and smoke (Exodus 19) → the Sermon on the Mount, a new law-giving (Matthew 5-7) → the Mount of Transfiguration (Matthew 17) → Mount Zion, the heavenly gathering (Hebrews 12:22-24).',
    forChild:'Climb onto a chair, a step stool, or a hill together and look around. Say: “God likes meeting His people up high sometimes — on a mountain He gave Moses the law, and on a mountain Jesus taught and later shone bright as light.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its chapters on the Sermon on the Mount and the Transfiguration both take place on a mountain and are worth reading side by side with this theme.' },
    outreach:'Create a few unhurried, set-apart moments with people — a walk, a quiet coffee, time away from screens — rather than only ever catching up in passing. Meaningful conversations tend to happen away from the noise, the same way Jesus often withdrew to teach.' },
  { id:'gleaning', icon:'sickle', title:'Gleaning & The Poor', category:'Extension Thread', complexity:1, defaultAssignee:null, extension:true,
    thread:'Leave the corners of the field on purpose — provision was always meant to have margin built in for someone else.',
    blurb:'Leave the corners of the field for the poor and the sojourner (Leviticus 19:9-10; Ruth 2) → "good news to the poor" as Jesus’s own mission statement (Luke 4:18) → James on caring for orphans and widows (James 1:27).',
    forChild:'Leave one cookie or treat aside on purpose for someone else before you eat yours. Say: “God told farmers to leave some of their field for people who didn’t have enough — on purpose, not by accident.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its account of Jesus reading Isaiah 61 in His hometown synagogue, announcing good news to the poor as His own mission, connects directly to this theme.' },
    outreach:'Build margin into your own resources on purpose — time, food, money — specifically to give away, rather than giving only from leftovers. People notice when generosity looks planned rather than accidental.' },
  { id:'wine', icon:'cup', title:'Wine & New Wine', category:'Extension Thread', complexity:2, defaultAssignee:null, extension:true,
    thread:'Bread and wine from a mysterious priest-king, wine that runs out at a wedding, and a cup that means two very different things.',
    blurb:'Melchizedek brings out bread and wine (Genesis 14:18) → new wine can’t go in old wineskins (Matthew 9:17) → water becomes wine at Cana → the cup of the new covenant (Luke 22:20) → the cup of God’s wrath (Revelation 14:10).',
    forChild:'Let her help stir juice or a drink for a family meal. Say: “At a wedding, Jesus turned plain water into the best wine anyone had tasted — He likes taking ordinary things and making them better than we expected.”',
    recommendedReading:{ title:'Desire of Ages', author:'Ellen G. White', note:'Its account of the wedding at Cana describes the miracle in its full setting, including why Jesus chose that ordinary family celebration for His first sign.' },
    outreach:'Show up for people’s ordinary celebrations — a birthday, a small win, a new job — not just their crises. Jesus’s first miracle wasn’t at a funeral, it was at a wedding; joy shared together builds real friendship too.' },
];

/** @typedef {{id:string, term:string, script:string, category:'hebrew'|'greek'|'culture', meaning:string, related:string[]}} GlossaryEntry */

/** @type {GlossaryEntry[]} */
const GLOSSARY = [
  { id:'kaphar', term:'Kaphar', script:'כָפַר', category:'hebrew', meaning:'To cover, to atone. The same root sits behind both ideas in Hebrew — covering sin and atoning for it are one motion, not two. God "covers" Adam and Eve at the cost of a life in Genesis 3, before the word is ever used technically of the sacrificial system.', related:['clothing','blood'] },
  { id:'shem', term:'Shem', script:'שֵם', category:'hebrew', meaning:'Name — but in Hebrew thought a name carries a person’s actual character and authority, not just a label for pointing at them. To know God’s name is to know who he is; to act "in his name" is to act under his authority.', related:['name'] },
  { id:'derek', term:'Derek', script:'דֶּרֶך', category:'hebrew', meaning:'Road, way, path — and by extension, a whole manner of life. The same word describes the physical route from one town to another and the entire direction of a person’s choices.', related:['way'] },
  { id:'chesed', term:'Chesed', script:'חֶסֶד', category:'hebrew', meaning:'Covenant loyalty, steadfast love — love that keeps its promise even when the other party breaks theirs. This is the word behind God’s pursuit of Israel in Hosea and behind "the Lord’s steadfast love never ceases" (Lamentations 3:22).', related:['marriage','shepherd','water'] },
  { id:'qadosh', term:'Qadosh', script:'קַדוֹש', category:'hebrew', meaning:'Holy — literally "set apart, other." Not primarily a moral score but a category: God is qadosh the way fire is hot, by nature, and things near him (a mountain, a tent, a people) become set apart too.', related:['fire','temple','eyes'] },
  { id:'ruach', term:'Ruach', script:'רוּחַ', category:'hebrew', meaning:'Spirit, breath, and wind — one word for all three, because ancient Hebrew didn’t separate "God’s active, invisible power" from "moving air" the way modern English does. The ruach hovers over the waters in Genesis 1 and falls as fire at Pentecost.', related:['fire'] },
  { id:'shalom', term:'Shalom', script:'שָלוֹם', category:'hebrew', meaning:'Peace — but closer to "wholeness, nothing missing, nothing broken" than to "absence of conflict." It’s the state every one of these themes is ultimately restoring.', related:[] },
  { id:'manna', term:'Manna', script:'מָן', category:'hebrew', meaning:'The name Israel gave the bread from heaven — from their own confused question "man hu?" ("what is it?"). They named the miracle after the fact that they didn’t understand it, and ate it daily anyway.', related:['bread'] },
  { id:'ekklesia', term:'Ekklesia', script:'ἐκκλησία', category:'greek', meaning:'"Called-out assembly" — translated "church," but originally just the ordinary Greek word for a public gathering of citizens summoned together. The New Testament borrows a civic word to describe a people called out by God.', related:['temple','kingdom'] },
  { id:'doulos', term:'Doulos', script:'δοῦλος', category:'greek', meaning:'Bondservant or slave — someone bound to a household by relationship and belonging, not a free-lance hired hand who can walk away. Paul calls himself this of Christ; Philippians 2 says Christ took this form of us.', related:['servant'] },
  { id:'metanoia', term:'Metanoia', script:'μετάνοια', category:'greek', meaning:'Repentance — literally a "change of mind" that becomes a change of direction. It’s a word about turning around on a road, which is why it pairs so naturally with "the Way."', related:['way'] },
  { id:'agape', term:'Agape', script:'ἀγάπη', category:'greek', meaning:'Selfless, covenant-shaped love — love as a decision and commitment rather than only a feeling. It’s the word Paul reaches for in 1 Corinthians 13 and the word John uses for "God is love."', related:['marriage','shepherd'] },
  { id:'poimen', term:'Poimen', script:'ποιμήν', category:'greek', meaning:'Shepherd — the same word later transliterated into "pastor." In the first century it named a specific, humble, outdoor job, not a title of status.', related:['shepherd'] },
  { id:'ampelos', term:'Ampelos', script:'ἄμπελος', category:'greek', meaning:'Vine — the word Jesus uses in John 15, deliberately picking up Israel’s own prophetic self-description (Psalm 80, Isaiah 5) and applying it to himself instead of the nation.', related:['vine'] },
  { id:'parousia', term:'Parousia', script:'παρουσία', category:'greek', meaning:'Coming, presence, arrival — used in the first century for an official’s formal visit to a city. The New Testament borrows it for Christ’s return, framing it as a King’s official arrival, not a vague spiritual event.', related:['kingdom','wilderness'] },
  { id:'logos', term:'Logos', script:'λόγος', category:'greek', meaning:'Word, or reasoned utterance — a term Greek philosophy already used for the rational order behind the universe. John takes that loaded word and says it "became flesh."', related:['light'] },
  { id:'nymphios', term:'Nymphios', script:'νυμφίος', category:'greek', meaning:'Bridegroom — a word that only carries its full weight against real 1st-century betrothal customs (see Betrothal Customs below).', related:['marriage'] },
  { id:'zyme', term:'Zyme', script:'ζύμη', category:'greek', meaning:'Leaven, yeast — in the ancient world always a piece of yesterday’s fermented dough saved to start tomorrow’s batch, never a separate packaged ingredient (see Leavening Process below).', related:['leaven'] },
  { id:'betrothal-practice', term:'Betrothal Customs', script:'Culture', category:'culture', meaning:'A Jewish betrothal was a legally binding stage, often lasting about a year, during which the groom returned to his father’s house to prepare a room or dwelling for his bride. He would then come for her at a time his father judged ready — often unannounced to the bride herself. This is the real-world backdrop behind "no one knows the day or the hour" and the ten virgins waiting with lamps.', related:['marriage'] },
  { id:'shepherding-practice', term:'Shepherding in Judea', script:'Culture', category:'culture', meaning:'A hired hand had no stake in the flock and would flee from a wolf; the owner-shepherd’s own livelihood and family depended on every sheep. Sheepfolds were often just a low stone wall with one opening — where the shepherd himself would lie down across the gap at night, literally becoming "the door" the sheep could not pass without going through him.', related:['shepherd'] },
  { id:'threshing-practice', term:'Threshing Floor & Harvest Calendar', script:'Culture', category:'culture', meaning:'Barley ripened first in the Judean spring, wheat weeks later; grain was threshed on a raised, wind-exposed floor where the useless chaff blew away and the valuable grain fell and stayed. Gleaning laws required landowners to leave the edges of a field unharvested for the poor — the real practice behind the Book of Ruth.', related:['harvest'] },
  { id:'leavening-practice', term:'Leavening Process', script:'Culture', category:'culture', meaning:'Ancient households did not buy separate yeast packets; they kept back a lump of fermented dough from one baking to start the next. A little of that old dough, worked all through a new batch, was enough to leaven the whole thing — exactly the image Paul and Jesus both reach for, in opposite directions.', related:['leaven'] },
  { id:'crucifixion-practice', term:'Roman Crucifixion & Garments', script:'Culture', category:'culture', meaning:'Under Roman practice, a condemned prisoner’s clothing legally became the property of the executing soldiers, who would divide it among themselves — exactly what happens at the cross, and exactly what Psalm 22:18 had described centuries earlier.', related:['clothing'] },
  { id:'atonement-practice', term:'Day of Atonement & Priestly Vestments', script:'Culture', category:'culture', meaning:'Once a year the high priest, in specially prescribed garments (Exodus 28), entered the Most Holy Place with the blood of a sacrifice, while a second goat ("the scapegoat") carried the people’s confessed sins away into the wilderness — two goats, together, picturing both atonement and removal.', related:['blood','temple'] },
  { id:'vineyard-tenancy', term:'Vineyard Tenancy', script:'Culture', category:'culture', meaning:'Absentee landowners commonly leased vineyards to tenant farmers under Roman-era law, taking a share of the harvest through agents. Disputes and even violence between owners and tenants over that share were a real and recognizable situation to Jesus’s first hearers — not an invented scenario.', related:['vine'] },
  { id:'salt-practice', term:'Salt as Covenant Seal', script:'Culture', category:'culture', meaning:'In the ancient Near East, salt was valuable enough to be used in trade and even, later, to help pay soldiers (the root of the word "salary"). Sharing salt or sealing an agreement "with salt" signified a binding, lasting commitment — which is why scripture calls God’s covenants "covenants of salt."', related:['salt'] },
  { id:'wilderness-geography', term:'Wilderness Geography', script:'Culture', category:'culture', meaning:'The Sinai and Negev wilderness that Israel crossed, and that Jesus was later driven into, is genuinely hostile terrain — extreme heat, almost no water or shade, sparse food. The "forty days" and "forty years" were not symbolic hardship; the ground itself was part of the test.', related:['wilderness'] },
  { id:'parable-tradition', term:'Rabbinic Parable Tradition', script:'Culture', category:'culture', meaning:'Teaching in parables (Hebrew <i>mashal</i>) was an established rabbinic method well before and during Jesus’s ministry — he was using a recognized teaching form of his time, not inventing a new one, even as he filled it with unmatched content.', related:['kingdom','vine','harvest'] },
];

function icon(name, cls){
  const body = ICONS[name] || ICONS.sun;
  return `<svg viewBox="0 0 24 24" class="${cls||''}" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== Persistence — everything lives in localStorage, per device. There
   is no shared account/database here on purpose: every family member can
   open this page without needing to sign in to anything, at the cost of
   checkmarks/notes not syncing between each person's own devices. ===== */
const STORAGE_KEY = 'goldenThreadsFamily.v1';
const THEME_KEY = 'goldenThreadsTheme';

function defaultAssignments(){
  const a = {};
  TOPICS.forEach(t=>{ a[t.id] = t.defaultAssignee || null; });
  return a;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}

const _saved = loadState();
const state = {
  assignments: (_saved && _saved.assignments) || defaultAssignments(),
  studied: (_saved && _saved.studied) || {},
  notes: (_saved && _saved.notes) || {},
};

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      assignments: state.assignments, studied: state.studied, notes: state.notes,
    }));
  }catch(e){}
}

function getThemeChoice(){
  try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function cycleTheme(){
  const cur = getThemeChoice();
  const next = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  try{
    if(next === 'auto') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, next);
  }catch(e){}
  if(next === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', next);
  renderAll();
}
function themeButtonLabel(){
  const cur = getThemeChoice();
  return cur === 'light' ? 'Light' : cur === 'dark' ? 'Dark' : 'Auto';
}
function themeButtonIcon(){
  return getThemeChoice() === 'dark' ? 'moon' : 'sun';
}

/* Transient, non-persisted UI state. */
let currentTab = 'family';
let searchQuery = '';
let lastToggledKey = null;
let flashTopicId = null;
const openDetails = new Set();

function onDetailsToggle(id, isOpen){
  if(isOpen) openDetails.add(id);
  else openDetails.delete(id);
}

const TAB_META = {
  family:   { label:'Family Plan',   icon:'people' },
  library:  { label:'Full Library',  icon:'book' },
  glossary: { label:'Glossary',      icon:'scroll' },
  media:    { label:'Further Study', icon:'headphones' },
  methods:  { label:'Study Methods', icon:'lightbulb' },
};
const VIEWS = {
  family: renderFamilyPlan,
  library: renderLibrary,
  glossary: renderGlossary,
  media: renderMedia,
  methods: renderStudyMethods,
};

function switchTab(key){
  currentTab = key;
  searchQuery = '';
  renderAll();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function washClass(personId){
  return { wedho:'wash-wed', miranda:'wash-mir', elizabeth:'wash-eli', lunathi:'wash-lun' }[personId] || '';
}
function iconClass(personId){
  return { wedho:'icon-wed', miranda:'icon-mir', elizabeth:'icon-eli', lunathi:'icon-lun' }[personId] || 'icon-none';
}
function progressFor(personId){
  const topics = TOPICS.filter(t=>state.assignments[t.id]===personId);
  const done = topics.filter(t=>state.studied[t.id]).length;
  return { done, total: topics.length };
}

function toggleStudied(id){
  state.studied[id] = !state.studied[id];
  lastToggledKey = state.studied[id] ? id : null;
  persist();
  renderAll();
}
function setAssignment(id, personId){
  state.assignments[id] = personId || null;
  persist();
  renderAll();
}
function saveNote(id, value){
  state.notes[id] = value;
  persist();
}

function topicRow(t, personId){
  const studied = !!state.studied[t.id];
  const note = state.notes[t.id] || '';
  const pop = (lastToggledKey === t.id) ? 'animate-pop' : '';
  return `
  <details class="rounded-xl bg-ink-card/60 border border-[rgb(var(--c-text-faint)/0.15)]" data-flash-target="${t.id}" ${openDetails.has(t.id) ? 'open' : ''} ontoggle="onDetailsToggle('${t.id}', this.open)">
    <summary class="flex items-center gap-2 px-3 py-2.5">
      <button type="button" onclick="event.stopPropagation();toggleStudied('${t.id}')"
        class="w-5 h-5 rounded border-2 flex-none flex items-center justify-center ${pop}"
        style="border-color:currentColor;${studied?'background:currentColor;':''}" title="Mark studied">
        ${studied ? `<span class="text-ink">${icon('check','w-3.5 h-3.5')}</span>` : ''}
      </button>
      <span class="${iconClass(personId)} flex-none">${icon(t.icon,'w-5 h-5')}</span>
      <span class="font-ui text-sm sm:text-base flex-1 min-w-0 truncate">${t.title}</span>
      <select onclick="event.stopPropagation()" onmousedown="event.stopPropagation()"
        onchange="event.stopPropagation();setAssignment('${t.id}',this.value)"
        class="font-ui text-xs bg-transparent border border-[rgb(var(--c-text-faint)/0.35)] rounded px-1.5 py-1 no-print">
        <option value="" ${!personId?'selected':''}>Unassigned</option>
        ${PEOPLE.map(p=>`<option value="${p.id}" ${personId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
      <span class="text-parchment-faint">${icon('chevron','w-4 h-4')}</span>
    </summary>
    <div class="px-3 pb-4 pt-1 space-y-2 font-ui text-sm">
      <p class="italic text-parchment-dim">${t.thread}</p>
      ${t.blurb ? `<p class="text-parchment-dim leading-relaxed">${t.blurb}</p>` : ''}
      ${t.forChild ? `
      <div class="rounded-lg wash-azure border p-2.5">
        <p class="text-xs font-semibold flex items-center gap-1.5 icon-azure">${icon('sparkle','w-3.5 h-3.5')} For Iviwe (almost 5)</p>
        <p class="text-parchment-dim leading-relaxed mt-1">${t.forChild}</p>
      </div>` : ''}
      ${t.recommendedReading ? `
      <div class="rounded-lg wash-azure border p-2.5">
        <p class="text-xs font-semibold flex items-center gap-1.5 icon-azure">${icon('book','w-3.5 h-3.5')} Recommended reading</p>
        <p class="text-parchment-dim leading-relaxed mt-1"><span class="font-display not-italic">${t.recommendedReading.title}</span> <span class="text-parchment-faint">— ${t.recommendedReading.author}</span><br>${t.recommendedReading.note}</p>
      </div>` : ''}
      ${t.outreach ? `
      <div class="rounded-lg wash-azure border p-2.5">
        <p class="text-xs font-semibold flex items-center gap-1.5 icon-azure">${icon('people','w-3.5 h-3.5')} Making friends & sharing the Good News</p>
        <p class="text-parchment-dim leading-relaxed mt-1">${t.outreach}</p>
      </div>` : ''}
      <label class="block text-xs text-parchment-faint mt-2">Your notes (saved on this device):</label>
      <textarea onchange="saveNote('${t.id}', this.value)" rows="2"
        class="w-full rounded-lg border border-[rgb(var(--c-text-faint)/0.3)] bg-ink/40 px-2 py-1.5 text-sm font-ui" placeholder="What stood out to you?">${escapeHtml(note)}</textarea>
    </div>
  </details>`;
}

function pickSurpriseTopic(){
  const pool = TOPICS.filter(t=>!state.studied[t.id]);
  const list = pool.length ? pool : TOPICS;
  const t = list[Math.floor(Math.random()*list.length)];
  currentTab = 'family';
  flashTopicId = t.id;
  openDetails.add(t.id);
  renderAll();
}

function renderFamilyPlan(){
  const overallDone = TOPICS.filter(t=>state.studied[t.id]).length;
  return `
  <div class="hero-band rounded-2xl p-5 sm:p-6 mb-6 border border-[rgb(var(--c-text-faint)/0.2)]">
    <p class="font-ui text-sm sm:text-base leading-relaxed">
      <strong class="font-display text-gold-bright">This is a study aid, not a substitute for study.</strong>
      Reading a topic card is the start, not the finish — real progress happens when you wrestle with the passages
      yourself, then explain what you found to someone else in the family. Check the
      <button type="button" class="underline decoration-dotted underline-offset-2" onclick="switchTab('methods')">Study Methods</button>
      tab for questions, methods and ways to present what you've learned.
    </p>
    <div class="mt-4 flex flex-wrap items-center gap-3">
      <div class="flex-1 min-w-[10rem] h-2.5 rounded-full bg-[rgb(var(--c-text-faint)/0.2)] overflow-hidden">
        <div class="h-full bg-gold bar-fill" style="width:${TOPICS.length? Math.round(overallDone/TOPICS.length*100):0}%"></div>
      </div>
      <span class="font-ui text-xs text-parchment-dim whitespace-nowrap">${overallDone} / ${TOPICS.length} studied — whole family</span>
      <button type="button" onclick="pickSurpriseTopic()" class="icon-btn flex items-center gap-1.5 px-3 py-2 rounded-lg border border-[rgb(var(--c-gold)/0.5)] text-gold-bright font-ui text-xs whitespace-nowrap hover:bg-[rgb(var(--c-gold)/0.1)] transition no-print">
        ${icon('sparkle','w-4 h-4')} Surprise Me
      </button>
    </div>
  </div>

  <div class="grid gap-5">
    ${PEOPLE.map(p=>{
      const topics = TOPICS.filter(t=>state.assignments[t.id]===p.id).sort((a,b)=>b.complexity-a.complexity);
      const { done, total } = progressFor(p.id);
      const pct = total ? Math.round(done/total*100) : 0;
      return `
      <section class="rounded-2xl border ${washClass(p.id)} p-4 sm:p-5">
        <div class="flex items-center gap-3 mb-1">
          <span class="${iconClass(p.id)}">${icon(p.icon,'w-7 h-7')}</span>
          <div class="flex-1 min-w-0">
            <h2 class="font-display text-xl">${p.name} <span class="font-ui text-sm text-parchment-dim font-normal">— ${p.role}</span></h2>
            <p class="font-ui text-xs text-parchment-dim">${p.tagline}</p>
          </div>
          <span class="font-ui text-xs text-parchment-dim whitespace-nowrap">${done}/${total}</span>
        </div>
        <div class="h-2 rounded-full bg-[rgb(var(--c-text-faint)/0.18)] overflow-hidden mb-3">
          <div class="h-full bar-fill ${iconClass(p.id)}" style="width:${pct}%;background:currentColor;"></div>
        </div>
        <div class="space-y-2">
          ${topics.map(t=>topicRow(t, p.id)).join('') || `<p class="font-ui text-xs text-parchment-faint italic">No topics assigned yet.</p>`}
        </div>
      </section>`;
    }).join('')}

    <section class="rounded-2xl border border-[rgb(var(--c-text-faint)/0.25)] p-4 sm:p-5">
      <h2 class="font-display text-xl mb-1 flex items-center gap-2"><span class="icon-none">${icon('signpost','w-5 h-5')}</span> Unassigned Extension Threads</h2>
      <p class="font-ui text-xs text-parchment-dim mb-3">Optional deeper threads — assign one to whoever wants to go further on a topic they've already studied.</p>
      <div class="space-y-2">
        ${TOPICS.filter(t=>!state.assignments[t.id]).map(t=>topicRow(t, null)).join('') || `<p class="font-ui text-xs text-parchment-faint italic">All threads are currently assigned.</p>`}
      </div>
    </section>
  </div>`;
}

function renderLibrary(){
  return `
  <div class="mb-4">
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-parchment-faint">${icon('search','w-4 h-4')}</span>
      <input type="text" value="${escapeHtml(searchQuery)}" oninput="onLibrarySearch(this.value)"
        placeholder="Search titles, threads, categories…"
        class="w-full font-ui text-sm rounded-lg border border-[rgb(var(--c-text-faint)/0.35)] bg-ink-card/50 pl-9 pr-3 py-2.5" />
    </div>
  </div>
  <div id="library-results">${buildLibraryResults()}</div>`;
}

function buildLibraryResults(){
  const q = searchQuery.trim().toLowerCase();
  const filtered = TOPICS.filter(t => !q ||
    t.title.toLowerCase().includes(q) ||
    t.category.toLowerCase().includes(q) ||
    t.thread.toLowerCase().includes(q));
  if(!filtered.length) return `<p class="font-ui text-sm text-parchment-faint italic py-6 text-center">No topics match "${escapeHtml(searchQuery)}".</p>`;
  const categories = [...new Set(filtered.map(t=>t.category))];
  return categories.map(cat => `
    <div class="mb-5">
      <h3 class="font-display text-sm tracking-wide text-parchment-faint uppercase mb-2">${cat}</h3>
      <div class="space-y-2">
        ${filtered.filter(t=>t.category===cat).map(t=>topicRow(t, state.assignments[t.id])).join('')}
      </div>
    </div>`).join('');
}

function onLibrarySearch(value){
  searchQuery = value;
  document.getElementById('library-results').innerHTML = buildLibraryResults();
}

function renderGlossary(){
  const groups = [
    { key:'hebrew', label:'Hebrew Terms', cls:'icon-wed' },
    { key:'greek', label:'Greek Terms', cls:'icon-mir' },
    { key:'culture', label:'Culture & Practice', cls:'icon-eli' },
  ];
  return groups.map(g => {
    const entries = GLOSSARY.filter(e=>e.category===g.key);
    if(!entries.length) return '';
    return `
    <section class="mb-6">
      <h2 class="font-display text-lg mb-3 flex items-center gap-2"><span class="${g.cls}">${icon('scroll','w-5 h-5')}</span> ${g.label}</h2>
      <div class="grid gap-3 sm:grid-cols-2">
        ${entries.map(e=>`
          <div class="rounded-xl border border-[rgb(var(--c-text-faint)/0.2)] bg-ink-card/50 p-3.5 card-hover">
            <p class="font-display text-base">${e.term} <span class="font-body italic text-parchment-dim text-sm">${e.script}</span></p>
            <p class="font-ui text-sm text-parchment-dim leading-relaxed mt-1">${e.meaning}</p>
          </div>`).join('')}
      </div>
    </section>`;
  }).join('');
}

function renderMedia(){
  return MEDIA.map(g => `
    <section class="mb-6">
      <h2 class="font-display text-lg mb-1 flex items-center gap-2"><span class="icon-none">${icon('headphones','w-5 h-5')}</span> ${g.heading}</h2>
      <p class="font-ui text-xs text-parchment-dim mb-3">${g.note}</p>
      <div class="grid gap-3 sm:grid-cols-2">
        ${g.items.map(it=>`
          <div class="rounded-xl border border-[rgb(var(--c-text-faint)/0.2)] bg-ink-card/50 p-3.5 card-hover">
            <p class="font-display text-base">${it.title}</p>
            <p class="font-ui text-xs text-parchment-faint">${it.author} · ${it.kind}</p>
            <p class="font-ui text-sm text-parchment-dim leading-relaxed mt-1.5">${it.blurb}</p>
          </div>`).join('')}
      </div>
    </section>`).join('');
}

function renderStudyMethods(){
  return `
  <div class="hero-band rounded-2xl p-5 sm:p-6 mb-6 border border-[rgb(var(--c-text-faint)/0.2)]">
    <h2 class="font-display text-xl text-gold-bright mb-2">This is a study aid — not a shortcut</h2>
    <p class="font-ui text-sm sm:text-base leading-relaxed mb-2">
      Nothing on this page replaces sitting with your Bible open. Every topic card is a starting map, not a finished
      answer — it points you to the passages; reading and wrestling with them is still yours to do. The goal for each
      person isn't to finish a checklist, it's to reach two things: understanding a theme well enough to explain it in
      your own words, and being ready to teach or discuss it with someone else in the family, so what you've learned
      actually gets passed on rather than staying private.
    </p>
    <p class="font-ui text-sm sm:text-base leading-relaxed">
      Use the questions and methods below to study actively rather than just reading passively, and use the
      presentation ideas to share what you found — teaching something is one of the fastest ways to discover whether
      you really understood it.
    </p>
  </div>

  <section class="mb-8">
    <h2 class="font-display text-lg mb-3">Study Methods</h2>
    <div class="grid gap-3 sm:grid-cols-2">
      ${STUDY_METHODS.map((m,i)=>`
        <div class="rounded-xl border border-[rgb(var(--c-text-faint)/0.2)] bg-ink-card/50 p-3.5 card-hover flex gap-3">
          <span class="step-badge bg-[rgb(var(--c-gold)/0.18)] text-gold-bright">${i+1}</span>
          <div>
            <p class="font-display text-base">${m.name}</p>
            <p class="font-ui text-sm text-parchment-dim leading-relaxed mt-1">${m.desc}</p>
          </div>
        </div>`).join('')}
    </div>
  </section>

  <section class="mb-8">
    <h2 class="font-display text-lg mb-3">Questions Worth Asking — of any topic</h2>
    <div class="grid gap-4 sm:grid-cols-2">
      ${QUESTIONS.map(group=>`
        <div class="rounded-xl border border-[rgb(var(--c-text-faint)/0.2)] bg-ink-card/50 p-3.5">
          <p class="font-display text-base text-gold-bright mb-2">${group.label}</p>
          <ul class="space-y-1.5 font-ui text-sm text-parchment-dim leading-relaxed list-disc list-inside">
            ${group.items.map(q=>`<li>${q}</li>`).join('')}
          </ul>
        </div>`).join('')}
    </div>
  </section>

  <section class="mb-6">
    <h2 class="font-display text-lg mb-3">Ways to Present What You Learned</h2>
    <div class="grid gap-3 sm:grid-cols-2">
      ${PRESENTATION_METHODS.map((m,i)=>`
        <div class="rounded-xl border border-[rgb(var(--c-text-faint)/0.2)] bg-ink-card/50 p-3.5 card-hover flex gap-3">
          <span class="step-badge bg-[rgb(var(--c-azure)/0.18)] text-azure-bright">${i+1}</span>
          <div>
            <p class="font-display text-base">${m.name}</p>
            <p class="font-ui text-sm text-parchment-dim leading-relaxed mt-1">${m.desc}</p>
          </div>
        </div>`).join('')}
    </div>
  </section>`;
}

function printCurrentView(){
  document.querySelectorAll('#tab-content details').forEach(d=>{ d.open = true; });
  setTimeout(()=>window.print(), 50);
}

function shellHTML(){
  return `
  <header class="border-b border-[rgb(var(--c-text-faint)/0.25)] bg-ink-raised/60">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-5 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-display text-2xl sm:text-3xl tracking-wide text-gold-bright flex items-center gap-2">
          <span class="icon-wed">${icon('book','w-7 h-7')}</span> Golden Threads
        </h1>
        <p class="font-ui text-sm text-parchment-dim mt-1 max-w-xl">
          A study aid, not a shortcut — see the <button type="button" class="underline decoration-dotted underline-offset-2" onclick="switchTab('methods')">Study Methods</button> tab before you begin.
        </p>
      </div>
      <div class="flex items-center gap-2 no-print">
        <button type="button" onclick="printCurrentView()" class="icon-btn flex items-center gap-1.5 px-3 py-2 rounded-lg border border-[rgb(var(--c-text-faint)/0.35)] font-ui text-sm hover:bg-ink-card transition" title="Print this view">
          ${icon('printer','w-4 h-4')} <span class="hidden sm:inline">Print</span>
        </button>
        <button type="button" onclick="cycleTheme()" class="icon-btn flex items-center gap-1.5 px-3 py-2 rounded-lg border border-[rgb(var(--c-text-faint)/0.35)] font-ui text-sm hover:bg-ink-card transition">
          ${icon(themeButtonIcon(),'w-4 h-4')} <span>${themeButtonLabel()}</span>
        </button>
      </div>
    </div>
    <nav class="max-w-5xl mx-auto px-4 sm:px-6 flex gap-1 overflow-x-auto scrollbar-thin no-print" role="tablist">
      ${Object.keys(TAB_META).map(key=>{
        const m = TAB_META[key];
        const active = key===currentTab;
        return `<button type="button" role="tab" aria-selected="${active}" onclick="switchTab('${key}')"
          class="tab-btn flex items-center gap-1.5 whitespace-nowrap px-3 py-2.5 border-b-2 ${active?'':'border-transparent'} font-ui text-sm ${active?'':'text-parchment-dim'} hover:text-gold-bright transition">
          ${icon(m.icon,'w-4 h-4')} ${m.label}
        </button>`;
      }).join('')}
    </nav>
  </header>
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
    <div id="tab-content"></div>
  </main>
  <footer class="max-w-5xl mx-auto px-4 sm:px-6 py-8 text-xs text-parchment-faint font-ui no-print space-y-1">
    <p>Saved on this device only — each family member's checkmarks, notes and theme choice stay on the device they use.</p>
    <p>Designed and Developed by <a href="https://tishbitedigital.co.za" target="_blank" rel="noopener noreferrer" class="underline decoration-dotted underline-offset-2 hover:text-gold-bright transition">Tishbite Digital</a></p>
  </footer>`;
}

function renderAll(){
  const app = document.getElementById('app');
  app.innerHTML = shellHTML();
  const content = document.getElementById('tab-content');
  content.innerHTML = VIEWS[currentTab]();
  content.classList.add('view-enter');
  if(flashTopicId){
    const el = document.querySelector(`[data-flash-target="${flashTopicId}"]`);
    if(el){
      el.classList.add('animate-flash');
      el.scrollIntoView({ behavior:'smooth', block:'center' });
    }
    flashTopicId = null;
  }
}

renderAll();
</script>
</body>
</html>
